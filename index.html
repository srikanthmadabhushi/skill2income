<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Skill2Income AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body { margin:0; font-family:'Inter'; background:#020617; color:white;}
.app { display:flex; height:100vh;}

.sidebar { width:260px; background:#0f172a; padding:10px; overflow:auto;}
.sidebar button {
  width:100%; margin-bottom:10px; padding:10px;
  background:#1e293b; border:none; border-radius:8px; color:white;
}

.chat-item {position: relative; padding: 10px; background: #111827;
  margin-bottom: 8px; border-radius: 6px;  display: flex;
  justify-content: space-between;  align-items: center;
}

.chat-menu { position:absolute; right:5px; top:28px;  background:#1f2937;
  border-radius:6px; display:none; z-index:9999;
}
.chat-menu div {padding: 8px 12px;  cursor: pointer;
}
.chat-menu div:hover { background: #374151;
}

.chat-container { flex:1; display:flex; flex-direction:column;}
.top-bar { padding:12px; border-bottom:1px solid #1e293b;}
.chat-box { flex:1; padding:20px; overflow:auto;}
.active-project-wrap { padding:14px 20px; border-bottom:1px solid #1e293b; background:#06111f; }
.active-project-card { background:#0f172a; border:1px solid #1e293b; border-radius:14px; padding:16px; }
.project-header { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.project-title { color:#22c55e; font-size:18px; font-weight:600; margin:0 0 6px 0; }
.project-subtitle { color:#94a3b8; margin:0; font-size:13px; }
.project-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.project-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 12px 0; }
.project-tab { background:#111827; color:white; border:none; border-radius:999px; padding:8px 12px; cursor:pointer; }
.project-tab.active { background:#2563eb; }
.project-content { background:#020617; border:1px solid #1f2937; border-radius:12px; padding:14px; }
.project-checklist label { display:block; margin:8px 0; color:#cbd5e1; }
.project-checklist input { margin-right:8px; }
.project-assets { color:#cbd5e1; }
.project-assets pre { white-space:pre-wrap; background:#111827; padding:10px; border-radius:10px; border:1px solid #1f2937; }
.project-empty { color:#94a3b8; font-size:14px; }
.modal-backdrop { position:fixed; inset:0; background:rgba(2,6,23,0.78); display:none; align-items:center; justify-content:center; z-index:10000; padding:16px; }
.modal-card { width:min(520px, 100%); background:#0b1220; border:1px solid #334155; border-radius:14px; padding:18px; box-shadow:0 18px 50px rgba(0,0,0,0.45); }
.modal-card h3 { margin-top:0; }
.modal-label { display:block; color:#cbd5e1; font-size:13px; font-weight:600; margin:10px 0 6px 0; }
.modal-card input, .modal-card textarea, .modal-card select { width:100%; box-sizing:border-box; margin-top:0; margin-bottom:12px; padding:12px; border-radius:10px; border:1px solid #475569; background:#111827; color:white; outline:none; }
.modal-card input::placeholder, .modal-card textarea::placeholder { color:#94a3b8; }
.modal-card input:focus, .modal-card textarea:focus, .modal-card select:focus { border-color:#38bdf8; box-shadow:0 0 0 3px rgba(56,189,248,0.18); }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; }

.chat-item span:first-child { flex: 1;  cursor: pointer;
}
.message { margin-bottom:15px; padding:12px; border-radius:10px;  max-width:70%;
}
.user { background:#2563eb; margin-left:auto;}
.ai { background:#111827;}

.suggestions { padding:10px; border-top:1px solid #1e293b;}
.suggestions button {  margin:5px; padding:8px 12px; border-radius:20px;
  background:#1f2937; border:none; color:white;
}

.input-box {display: flex; align-items: center; gap: 8px; padding: 10px;background: #020617; position: sticky; bottom: 0;
}


input { flex: 1; padding: 10px; border-radius: 8px;border: none; font-size: 14px;
}

button.send {padding: 10px 14px; border-radius: 8px; background: #22c55e; color: white; border: none; cursor: pointer; white-space: nowrap;
}

a { color:#60a5fa; text-decoration:underline; }

@media (max-width: 768px) { 

  .app {
    flex-direction: column; height: auto;
  }

  .sidebar { width: 100%; height: auto; display: flex; overflow-x: auto; gap: 8px;
  }

  .sidebar button {flex: 1; font-size: 12px; padding: 8px;
  }

  .chat-container { flex: 1; display: flex; flex-direction: column; height: 100vh;
  }

  .chat-box {flex: 1; overflow-y: auto;
  }

  .message {max-width: 95%; font-size: 14px;
  }

  .input-box {flex-direction: row; padding: 8px;
  }

  input {font-size: 13px;
  }

  button.send {padding: 8px 10px; font-size: 12px;
  }

  .suggestions {display: flex;overflow-x: auto;
  }

  .suggestions button { white-space: nowrap; font-size: 12px;
  }
}
.sidebar {transition: all 0.3s ease;
}

.sidebar.hide {display: none;
}
</style>

</head>

<body>

<div class="app">

<div class="sidebar" id="sidebar"></div>

<div class="chat-container">
<div class="top-bar">🚀 Skill2Income AI</div>
<div id="activeProjectMount" class="active-project-wrap"></div>

<div id="chat" class="chat-box"></div>


<div class="input-box">
<input id="userInput" placeholder="Type your idea...">
<button class="send" onclick="sendMessage()">Send</button>
</div>

</div>
</div>

<div id="issueModal" class="modal-backdrop">
  <div class="modal-card">
    <h3>Report an Issue</h3>
    <label class="modal-label" for="issueTitle">Issue Title</label>
    <input id="issueTitle" placeholder="Example: Launch Agent button is failing">
    <label class="modal-label" for="issueDescription">Issue Description</label>
    <textarea id="issueDescription" rows="5" placeholder="Describe what happened, what you expected, and any steps to reproduce the issue."></textarea>
    <label class="modal-label" for="issueSeverity">Severity</label>
    <select id="issueSeverity">
      <option>Low</option>
      <option selected>Medium</option>
      <option>High</option>
    </select>
    <label class="modal-label" for="issueFeature">Feature / Area</label>
    <input id="issueFeature" placeholder="Example: AI Coach, Launch Agent, Sidebar">
    <div class="modal-actions">
      <button class="project-tab" onclick="closeIssueModal()">Cancel</button>
      <button class="project-tab" onclick="submitIssueReport()">Send to ServiceNow</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey:"AIzaSyBUdYVcFTTm2DlmKZJG9_t6Vdu2_P3MuIg",
  authDomain:"skill2income-adef1.firebaseapp.com",
  projectId:"skill2income-adef1"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const chat = document.getElementById("chat");
const sidebar = document.getElementById("sidebar");
const userInput = document.getElementById("userInput");
const activeProjectMount = document.getElementById("activeProjectMount");
const issueModal = document.getElementById("issueModal");

let currentChatId=null;
let messages=[];
let currentPlans=[];
let selectedCoachIdea=null;
let activeProject=null;
let activeProjectTab="overview";
let activeProjectCollapsed=false;
const analyticsSessionId = `session_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;

function getHistoryText(message){
  if (message.historyText) return message.historyText;
  return (message.text || "").replace(/<[^>]+>/g, "");
}

function isPlanPrompt(text){
  return /(30\s*day|30\s*days|plan|roadmap|week by week|day by day)/i.test(text || "");
}

function getLatestTopic(){
  for(let i = messages.length - 1; i >= 0; i--){
    const msg = messages[i];
    if(msg.role !== "user") continue;
    const text = (msg.text || "").trim();
    if(!text || isPlanPrompt(text)) continue;
    return text;
  }
  return "";
}

function closeAllChatMenus(){
  document.querySelectorAll(".chat-menu").forEach(menu => {
    menu.style.display = "none";
  });
}

// ENTER
userInput.addEventListener("keypress", e=>{
 if(e.key==="Enter") sendMessage();
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".chat-item")) {
    closeAllChatMenus();
  }
});

// LOGIN
function login(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then(res => console.log("Logged in:", res.user.email))
    .catch(err => console.error("Login error:", err));
}

// AUTH
auth.onAuthStateChanged(user => {
  if (user) {
    loadChatList();
    loadActiveProject();
  } else {
    activeProject = null;
    renderActiveProjectPanel();
    sidebar.innerHTML = `
      <button id="loginBtn" onclick="login()">🔐 Login</button>
    `;
  }
});


// SMART LINKS
function getSmartLinks(title){
 const t=title.toLowerCase();

 if(t.includes("freelance")){
  return `👉 <a href="https://www.fiverr.com" target="_blank">Fiverr</a><br>
          👉 <a href="https://www.upwork.com" target="_blank">Upwork</a>`;
 }

 if(t.includes("student")){
  return `👉 <a href="https://www.chegg.com" target="_blank">Chegg</a><br>
          👉 <a href="https://www.studypool.com" target="_blank">Studypool</a>`;
 }

 if(t.includes("passive")){
  return `👉 <a href="https://gumroad.com" target="_blank">Gumroad</a><br>
          👉 <a href="https://shopify.com" target="_blank">Shopify</a>`;
 }

 return `👉 <a href="https://www.google.com" target="_blank">Explore More</a>`;
}

// SIDEBAR
function loadChatList(){
 const user=auth.currentUser;

 db.collection("users").doc(user.uid)
 .collection("chats").orderBy("createdAt","desc")
 .get().then(snapshot=>{

  sidebar.innerHTML = `
  <button onclick="newChat()">➕ New Chat</button>
  <button onclick="goDashboard()">📊 Saved Plans</button>
  <button onclick="openIssueModal()">🛠 Report Issue</button>

  <button id="logoutBtn" onclick="logout()">🚪 Logout</button>

  <p style="font-size:12px;color:#94a3b8;">${auth.currentUser.email}</p>

  <button onclick="showUpgrade()">💎 Upgrade</button>

  <hr>
`;

  snapshot.forEach(doc=>{
    const container=document.createElement("div");
    container.className="chat-item";

    const title=document.createElement("span");
    title.innerText=doc.data().title;
    title.onclick=(e)=>{e.stopPropagation();
  loadChat(doc.id);
};

    const btn = document.createElement("span");
btn.innerText = "⋮";
btn.style.cursor = "pointer";

const menu = document.createElement("div");
menu.className = "chat-menu";

const rename = document.createElement("div");
rename.innerText = "Rename";
rename.onclick = () => {
  closeAllChatMenus();
  const newName = prompt("Enter new name:");
  if(newName) renameChat(doc.id, newName);
};

    const del = document.createElement("div");
del.innerText = "Delete";
del.onclick = () => {
  closeAllChatMenus();
  const shouldDelete = confirm("Delete this chat?");
  if(shouldDelete) deleteChat(doc.id);
};

menu.appendChild(rename);
menu.appendChild(del);

btn.onclick = (e) => {
  e.stopPropagation();
  const willOpen = menu.style.display !== "block";
  closeAllChatMenus();
  menu.style.display = willOpen ? "block" : "none";
};

    container.appendChild(title);
    container.appendChild(btn);
    container.appendChild(menu);

    sidebar.appendChild(container);
  });
 });
}

// MESSAGE
function addMessage(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.innerHTML=text;

  const id = Date.now();
  div.setAttribute("data-id", id);

  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;

  return id; // 🔥 IMPORTANT
}

function escapeHtml(text){
  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function setInputValue(text){
  userInput.value = text || "";
  userInput.focus();
}

function openIssueModal(){
  issueModal.style.display = "flex";
}

function closeIssueModal(){
  issueModal.style.display = "none";
}

function getFriendlyServiceNowError(errorText){
  const text = String(errorText || "");
  if(text.includes("ServiceNow credentials are not configured on the backend.")){
    return "ServiceNow backend credentials are missing. Add SERVICENOW_INSTANCE, SERVICENOW_USERNAME, and SERVICENOW_PASSWORD to your backend environment and redeploy.";
  }
  return text;
}

function trackEvent(eventName, metadata = {}){
  const payload = {
    event: eventName,
    metadata,
    sessionId: analyticsSessionId,
    chatId: currentChatId || null,
    userId: auth.currentUser?.uid || null,
    createdAt: new Date().toISOString()
  };

  console.log("analytics", payload);

  db.collection("analytics_events").add(payload).catch(err => {
    console.error("analytics error", err);
  });
}

function getProjectChecklist(){
  return [
    { key: "idea_selected", label: "Idea selected" },
    { key: "validation_completed", label: "Validation toolkit completed" },
    { key: "execution_plan_opened", label: "Execution plan opened" },
    { key: "first_offer_written", label: "First offer written" },
    { key: "first_outreach_sent", label: "First outreach sent" },
    { key: "first_customer_contacted", label: "First customer contacted" }
  ];
}

function buildProjectAssets(project){
  const title = project?.title || "your idea";
  const audience = project?.who_is_this_for || "a narrow niche customer";
  return {
    outreach: `Hi [Name], I am building ${title} for ${audience}. I noticed teams like yours often struggle with [specific pain point]. Would you be open to a 15-minute chat so I can show a simple version and get feedback?`,
    landing: `Headline: Launch ${title} faster\nSubheadline: A focused solution for ${audience} who need a better way to handle this workflow.\nCTA: Book an early access demo`,
    offer: `First offer: I will set up the first version of ${title} for one niche customer, with onboarding support and a feedback loop, in exchange for an early pilot fee.`
  };
}

function renderActiveProjectPanel(){
  if(!activeProject){
    activeProjectMount.innerHTML = `
      <div class="active-project-card">
        <div class="project-empty">No active project yet. Pick an idea card and click <b>Set Active Project</b> to turn it into a reusable workspace.</div>
      </div>
    `;
    return;
  }

  const checklist = getProjectChecklist();
  const progressDone = checklist.filter(item => activeProject.progress?.[item.key]).length;
  const assets = buildProjectAssets(activeProject);
  if(activeProjectCollapsed){
    activeProjectMount.innerHTML = `
      <div class="active-project-card">
        <div class="project-header">
          <div>
            <p class="project-subtitle">Active Project</p>
            <h3 class="project-title">${escapeHtml(activeProject.title || "Untitled idea")}</h3>
          </div>
          <button class="project-tab" onclick="expandActiveProject()">Open Workspace</button>
        </div>
      </div>
    `;
    return;
  }
  let contentHtml = "";

  if(activeProjectTab === "overview"){
    const validationScore = activeProject.validation_toolkit?.validation_score;
    const validationSummary = activeProject.validation_toolkit?.validation_summary;
    contentHtml = `
      <p><b>Why it works:</b><br>${escapeHtml(activeProject.why_it_works || activeProject.description || "")}</p>
      <p><b>Who it serves:</b><br>${escapeHtml(activeProject.who_is_this_for || "A focused target customer")}</p>
      <p><b>Current goal:</b><br>${escapeHtml(activeProject.current_goal || "Validate the smallest version and get the first customer conversation.")}</p>
      ${validationScore ? `<p><b>Validation score:</b><br>${escapeHtml(validationScore.label || "Unknown")} (${escapeHtml(String(validationScore.score || ""))}/10)${validationScore.reason ? ` - ${escapeHtml(validationScore.reason)}` : ""}</p>` : ""}
      ${validationSummary ? `<p><b>Validation summary:</b><br>${escapeHtml(validationSummary)}</p>` : ""}
    `;
  } else if(activeProjectTab === "progress"){
    contentHtml = `
      <div class="project-checklist">
        ${checklist.map(item => `
          <label>
            <input type="checkbox" ${activeProject.progress?.[item.key] ? "checked" : ""} onchange="toggleProjectTask('${item.key}')">
            ${item.label}
          </label>
        `).join("")}
      </div>
      <p style="color:#38bdf8; margin-top:10px;"><b>Progress:</b> ${progressDone}/${checklist.length} milestones completed</p>
    `;
  } else {
    contentHtml = `
      <div class="project-assets">
        <p><b>Outreach template</b></p>
        <pre>${escapeHtml(assets.outreach)}</pre>
        <p><b>Landing page copy</b></p>
        <pre>${escapeHtml(assets.landing)}</pre>
        <p><b>First offer script</b></p>
        <pre>${escapeHtml(assets.offer)}</pre>
      </div>
    `;
  }

  activeProjectMount.innerHTML = `
    <div class="active-project-card">
      <div class="project-header">
        <div>
          <p class="project-subtitle">Active Project</p>
          <h3 class="project-title">${escapeHtml(activeProject.title || "Untitled idea")}</h3>
          <p class="project-subtitle">Resume this idea instead of starting from scratch.</p>
        </div>
        <div style="text-align:right; color:#94a3b8; font-size:13px;">${progressDone}/${checklist.length} milestones done</div>
      </div>
      <div class="project-actions">
        <button class="project-tab" onclick="continueActiveCoach()">Continue with AI Coach</button>
        <button class="project-tab" onclick="runValidationToolkit()">Run Validation Toolkit</button>
        <button class="project-tab" onclick="runLaunchAgent()">Run Launch Agent</button>
        <button class="project-tab" onclick="pushToServiceNow()">Push to ServiceNow</button>
        <button class="project-tab" onclick="reuseActiveProjectInChat()">Reuse in Chat</button>
        <button class="project-tab" onclick="clearActiveProject()">Clear Project</button>
      </div>
      <div class="project-tabs">
        <button class="project-tab ${activeProjectTab === "overview" ? "active" : ""}" onclick="switchProjectTab('overview')">Overview</button>
        <button class="project-tab ${activeProjectTab === "progress" ? "active" : ""}" onclick="switchProjectTab('progress')">Progress</button>
        <button class="project-tab ${activeProjectTab === "assets" ? "active" : ""}" onclick="switchProjectTab('assets')">Assets</button>
      </div>
      <div class="project-content">${contentHtml}</div>
    </div>
  `;
}

function switchProjectTab(tab){
  activeProjectTab = tab;
  renderActiveProjectPanel();
}

function collapseActiveProject(){
  activeProjectCollapsed = true;
  renderActiveProjectPanel();
}

function expandActiveProject(){
  activeProjectCollapsed = false;
  renderActiveProjectPanel();
}

function saveActiveProjectToStore(project){
  if(!auth.currentUser) return Promise.resolve();
  return db.collection("users").doc(auth.currentUser.uid)
    .collection("workspace").doc("current_project")
    .set({
      ...project,
      updatedAt: new Date()
    }, { merge: true });
}

function loadActiveProject(){
  if(!auth.currentUser) return;
  db.collection("users").doc(auth.currentUser.uid)
    .collection("workspace").doc("current_project")
    .get()
    .then(doc => {
      activeProject = doc.exists ? doc.data() : null;
      renderActiveProjectPanel();
    })
    .catch(err => {
      console.error("active project load error", err);
      renderActiveProjectPanel();
    });
}

function setActiveProject(index){
  const idea = currentPlans[index];
  if(!idea || !auth.currentUser) return;

  activeProject = {
    title: idea.title || "",
    description: idea.description || "",
    who_is_this_for: idea.who_is_this_for || "",
    why_it_works: idea.why_it_works || "",
    current_goal: `Validate ${idea.title || "this idea"} with a narrow audience and get the first real customer conversation.`,
    progress: {
      idea_selected: true,
      validation_completed: false,
      execution_plan_opened: false,
      first_offer_written: false,
      first_outreach_sent: false,
      first_customer_contacted: false
    },
    createdAt: new Date(),
    updatedAt: new Date()
  };

  activeProjectTab = "overview";
  activeProjectCollapsed = false;
  renderActiveProjectPanel();
  saveActiveProjectToStore(activeProject);
  trackEvent("active_project_set", { idea_title: idea.title });
}

function toggleProjectTask(taskKey){
  if(!activeProject) return;
  activeProject.progress = activeProject.progress || {};
  activeProject.progress[taskKey] = !activeProject.progress[taskKey];
  renderActiveProjectPanel();
  saveActiveProjectToStore(activeProject);
  trackEvent("active_project_progress_updated", { idea_title: activeProject.title, task: taskKey, value: activeProject.progress[taskKey] });
}

function continueActiveCoach(){
  if(!activeProject) return;
  selectedCoachIdea = {
    title: activeProject.title || "",
    description: activeProject.description || ""
  };
  trackEvent("active_project_continue_coach", { idea_title: activeProject.title });
  collapseActiveProject();
  setInputValue(`Help me move forward with ${activeProject.title}`);
}

function reuseActiveProjectInChat(){
  if(!activeProject) return;
  collapseActiveProject();
  setInputValue(activeProject.title || "");
}

function clearActiveProject(){
  if(!auth.currentUser) return;
  const title = activeProject?.title || null;
  activeProject = null;
  selectedCoachIdea = null;
  activeProjectCollapsed = false;
  renderActiveProjectPanel();
  db.collection("users").doc(auth.currentUser.uid)
    .collection("workspace").doc("current_project")
    .delete()
    .catch(err => console.error("clear active project error", err));
  trackEvent("active_project_cleared", { idea_title: title });
}

async function runLaunchAgent(){
  if(!activeProject) return;

  collapseActiveProject();
  const loadingId = addMessage(`⏳ Launch Agent is building assets for <b>${escapeHtml(activeProject.title)}</b>...`, "ai");
  trackEvent("launch_agent_run", { idea_title: activeProject.title });

  try{
    let res = await fetch("https://skill2income-api.onrender.com/launch-agent", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        idea_title: activeProject.title || "",
        idea_description: activeProject.description || "",
        history: messages.map(m => ({
          role: m.role,
          text: getHistoryText(m)
        }))
      })
    });

    if(!res.ok){
      res = await fetch("https://skill2income-api.onrender.com/generate-income-plan", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          request_type: "launch_agent",
          idea_title: activeProject.title || "",
          idea_description: activeProject.description || "",
          interests: activeProject.title || "",
          history: messages.map(m => ({
            role: m.role,
            text: getHistoryText(m)
          }))
        })
      });
    }

    if(!res.ok){
      removeMessage(loadingId);
      addMessage(`❌ Launch Agent could not finish. Server returned ${res.status}.`, "ai");
      return;
    }

    const data = await res.json();
    const plan = data?.result;
    if(!plan || Array.isArray(plan)){
      removeMessage(loadingId);
      addMessage("⚠️ Launch Agent response format not supported.","ai");
      return;
    }

    removeMessage(loadingId);
    const html = renderLaunchAgent(plan, activeProject.title || "Launch Agent");
    addMessage(html, "ai");
    messages.push({
      role: "ai",
      text: html,

function loadChat(id){
  db.collection("users").doc(auth.currentUser.uid)
  .collection("chats").doc(id).get().then(doc=>{
    if(!doc.exists) return;

    currentChatId = id;

    messages = doc.data().messages || [];

    chat.innerHTML = "";

    messages.forEach(m => {
      if (m.hidden) return;
      addMessage(m.text, m.role);
    });

    chat.scrollTop = chat.scrollHeight;
  });
}

         ${(Array.isArray(tasks) ? tasks : typeof tasks === "string"
      ? [tasks]
      : Object.values(tasks || {})
).map(t => `<li>${t}</li>`).join("")}
        </ul>
      </div>
    `;
  });

  html += `</div>`;

  addMessage(html,"ai");
  return html;
}

function normalizeServiceNowRecordUrl(result){
  const table = String(result?.table || "incident").trim();
  const sysId = String(result?.sys_id || "").trim();
  const rawUrl = String(result?.url || "").trim();

  if(sysId){
    const instanceMatch = rawUrl.match(/^(https?:\/\/[^/]+)/i);
    const instanceBase = instanceMatch ? instanceMatch[1] : "https://dev350339.service-now.com";
    return `${instanceBase}/nav_to.do?uri=${encodeURIComponent(`${table}.do?sys_id=${sysId}`)}`;
  }

  return rawUrl;
}
