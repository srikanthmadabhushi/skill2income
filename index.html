<html>
<head>

<style>
body { margin:0; font-family:'Inter'; background:#020617; color:white; overflow:hidden;}
.app { display:flex; height:100vh; height:100dvh;}

.sidebar-backdrop { display:none; }
.sidebar { width:260px; background:#0f172a; padding:10px; overflow:auto; flex-shrink:0;}
.sidebar button {
  width:100%; margin-bottom:10px; padding:10px;
  background:#1e293b; border:none; border-radius:8px; color:white;
}

.chat-item {position: relative; padding: 10px; background: #111827;
  margin-bottom: 8px; border-radius: 6px;  display: flex;
  justify-content: space-between;  align-items: center;
}

.chat-menu { position:absolute; right:5px; top:28px;  background:#1f2937;
  border-radius:6px; display:none; z-index:9999;
}
.chat-menu div {padding: 8px 12px;  cursor: pointer;
}
.chat-menu div:hover { background: #374151;
}

.chat-container { flex:1; display:flex; flex-direction:column; min-width:0;}
.top-bar { padding:12px; border-bottom:1px solid #1e293b; display:flex; align-items:center; gap:12px;}
.top-bar-title { font-weight:600; }
.mobile-menu-btn { display:none; background:#1e293b; color:white; border:none; border-radius:10px; padding:8px 10px; cursor:pointer; }
.chat-box { flex:1; padding:20px; overflow:auto;}
.active-project-wrap { padding:14px 20px; border-bottom:1px solid #1e293b; background:#06111f; }
.active-project-card { background:#0f172a; border:1px solid #1e293b; border-radius:14px; padding:16px; }
.project-header { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.project-title { color:#22c55e; font-size:18px; font-weight:600; margin:0 0 6px 0; }
.project-subtitle { color:#94a3b8; margin:0; font-size:13px; }
.project-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.project-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 12px 0; }
.project-tab { background:#111827; color:white; border:none; border-radius:999px; padding:8px 12px; cursor:pointer; }
.project-tab.active { background:#2563eb; }
.project-content { background:#020617; border:1px solid #1f2937; border-radius:12px; padding:14px; }
.project-checklist label { display:block; margin:8px 0; color:#cbd5e1; }
.project-checklist input { margin-right:8px; }
.project-assets { color:#cbd5e1; }
.project-assets pre { white-space:pre-wrap; background:#111827; padding:10px; border-radius:10px; border:1px solid #1f2937; }
.project-empty { color:#94a3b8; font-size:14px; }
.modal-backdrop { position:fixed; inset:0; background:rgba(2,6,23,0.78); display:none; align-items:center; justify-content:center; z-index:10000; padding:16px; }
.modal-card { width:min(520px, 100%); background:#0b1220; border:1px solid #334155; border-radius:14px; padding:18px; box-shadow:0 18px 50px rgba(0,0,0,0.45); }
.modal-card h3 { margin-top:0; }
.modal-label { display:block; color:#cbd5e1; font-size:13px; font-weight:600; margin:10px 0 6px 0; }
.modal-card input, .modal-card textarea, .modal-card select { width:100%; box-sizing:border-box; margin-top:0; margin-bottom:12px; padding:12px; border-radius:10px; border:1px solid #475569; background:#111827; color:white; outline:none; }
.modal-card input::placeholder, .modal-card textarea::placeholder { color:#94a3b8; }
.modal-card input:focus, .modal-card textarea:focus, .modal-card select:focus { border-color:#38bdf8; box-shadow:0 0 0 3px rgba(56,189,248,0.18); }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; }

.chat-item span:first-child { flex: 1;  cursor: pointer;
}
.message { margin-bottom:15px; padding:12px; border-radius:10px;  max-width:70%; overflow-wrap:anywhere;
}
.user { background:#2563eb; margin-left:auto;}
.ai { background:#111827;}

.suggestions { padding:10px; border-top:1px solid #1e293b;}
.suggestions button {  margin:5px; padding:8px 12px; border-radius:20px;
  background:#1f2937; border:none; color:white;
}

.input-box {display: flex; align-items: center; gap: 8px; padding: 10px;background: #020617; position: sticky; bottom: 0; border-top:1px solid #1e293b; padding-bottom:calc(10px + env(safe-area-inset-bottom));
}


input { flex: 1; padding: 10px; border-radius: 8px;border: none; font-size: 14px;
}

button.send {padding: 10px 14px; border-radius: 8px; background: #22c55e; color: white; border: none; cursor: pointer; white-space: nowrap;
}

a { color:#60a5fa; text-decoration:underline; }

@media (max-width: 768px) {
  body { overflow:auto; }

  .app {
    display:block;
    height:100vh;
    height:100dvh;
  }

  .sidebar-backdrop.open {
    display:block;
    position:fixed;

  .sidebar {

    left:0;
    bottom:0;

  }

  .sidebar button {
    font-size:14px;
    padding:12px;
  }

  .chat-container {
    height:100vh;

  }

    position:sticky;
    top:0;
    z-index:20;
    background:#020617;
    padding:12px 14px;
  }

  .mobile-menu-btn {

    align-items:center;
    justify-content:center;
  }

  .chat-box {
    padding:14px;
  }

  .active-project-wrap {
    padding:12px 14px;
  }

  .active-project-card {
    padding:14px;
  }

  .project-header,
  .modal-actions {
    flex-direction:column;
    align-items:stretch;
  }

  .project-actions,
  .project-tabs {
    gap:10px;
  }

  .project-tab {
    width:100%;
    text-align:center;
  }

    max-width:100%;
    font-size:14px;
  }

  .input-box {
    padding:10px 12px;
  }

  input {
    min-width:0;
    font-size:16px;
  }

  button.send {
    padding:10px 12px;
    font-size:13px;
  }

  .suggestions {
    display:flex;
    overflow-x:auto;
    padding:8px 10px;
  }

  .suggestions button {
    white-space:nowrap;
    font-size:12px;
  }

  .chat-item {
    align-items:flex-start;
    gap:10px;
  }

  .chat-menu {
    right:0;
    top:34px;
  }

  .modal-card {
    width:100%;
    max-height:85vh;
    overflow:auto;
  }
}
.sidebar {transition: all 0.3s ease;
}

.sidebar.hide {display: none;

<body>

<div class="app">

<div class="sidebar" id="sidebar"></div>

<div class="top-bar">

<div id="issueModal" class="modal-backdrop">
  <div class="modal-card">
    <h3>Report an Issue</h3>
    <label class="modal-label" for="issueTitle">Issue Title</label>
    <input id="issueTitle" placeholder="Example: Launch Agent button is failing">
    <label class="modal-label" for="issueDescription">Issue Description</label>
    <textarea id="issueDescription" rows="5" placeholder="Describe what happened, what you expected, and any steps to reproduce the issue."></textarea>

      <option>Low</option>

</div>

<div id="ticketStatusModal" class="modal-backdrop">

    <h3>Check Ticket Status</h3>

    <input id="ticketStatusNumber" placeholder="Example: INC0010086">
    <div class="modal-actions">
      <button class="project-tab" onclick="closeTicketStatusModal()">Cancel</button>
      <button class="project-tab" onclick="submitTicketStatusCheck()">Check Status</button>
    </div>
  </div>
</div>

<div id="myTicketsModal" class="modal-backdrop">
  <div class="modal-card">
    <h3>My Tickets</h3>

    <div class="modal-actions">
      <button class="project-tab" onclick="closeMyTicketsModal()">Close</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey:"AIzaSyBUdYVcFTTm2DlmKZJG9_t6Vdu2_P3MuIg",
  authDomain:"skill2income-adef1.firebaseapp.com",
  projectId:"skill2income-adef1"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const chat = document.getElementById("chat");
const sidebar = document.getElementById("sidebar");
const sidebarBackdrop = document.getElementById("sidebarBackdrop");
const userInput = document.getElementById("userInput");
const activeProjectMount = document.getElementById("activeProjectMount");
const issueModal = document.getElementById("issueModal");
const ticketStatusModal = document.getElementById("ticketStatusModal");
const myTicketsModal = document.getElementById("myTicketsModal");
const myTicketsBody = document.getElementById("myTicketsBody");

let currentChatId=null;
let messages=[];
let currentPlans=[];
let selectedCoachIdea=null;
let activeProject=null;
let activeProjectTab="overview";
let activeProjectCollapsed=false;
let supportTickets=[];
let compareIdeas=[];
const analyticsSessionId = `session_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;

function getHistoryText(message){
  if (message.historyText) return message.historyText;
  return (message.text || "").replace(/<[^>]+>/g, "");
}

function isPlanPrompt(text){
  return /(30\s*day|30\s*days|plan|roadmap|week by week|day by day)/i.test(text || "");
}

function getLatestTopic(){
  for(let i = messages.length - 1; i >= 0; i--){
    const msg = messages[i];
    if(msg.role !== "user") continue;
    const text = (msg.text || "").trim();
    if(!text || isPlanPrompt(text)) continue;
    return text;
  }
  return "";
}

function closeAllChatMenus(){
  document.querySelectorAll(".chat-menu").forEach(menu => {
    menu.style.display = "none";
  });
}

function isMobileView(){
  return window.innerWidth <= 768;
}

function openMobileSidebar(){
  if(!isMobileView()) return;
  sidebar.classList.add("mobile-open");
  sidebarBackdrop.classList.add("open");
}

function closeMobileSidebar(){
  sidebar.classList.remove("mobile-open");
  sidebarBackdrop.classList.remove("open");
}

function toggleMobileSidebar(){
  if(sidebar.classList.contains("mobile-open")){
    closeMobileSidebar();
  } else {
    openMobileSidebar();
  }
}

// ENTER
userInput.addEventListener("keypress", e=>{
 if(e.key==="Enter") sendMessage();
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".chat-item")) {
    closeAllChatMenus();
  }
});

window.addEventListener("resize", () => {
  if(!isMobileView()){
    closeMobileSidebar();
  }
});

// LOGIN
function login(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then(res => console.log("Logged in:", res.user.email))
    .catch(err => console.error("Login error:", err));
}

// AUTH
auth.onAuthStateChanged(user => {
  if (user) {
    loadChatList();
    loadActiveProject();
    loadSupportTickets();
  } else {
    activeProject = null;
    supportTickets = [];
    compareIdeas = [];
    renderActiveProjectPanel();
    sidebar.innerHTML = `
      <button id="loginBtn" onclick="login()">🔐 Login</button>
    `;
  }
});


// SMART LINKS
function getSmartLinks(title){
 const t=title.toLowerCase();

 if(t.includes("freelance")){
  return `👉 <a href="https://www.fiverr.com" target="_blank">Fiverr</a><br>
          👉 <a href="https://www.upwork.com" target="_blank">Upwork</a>`;
 }

 if(t.includes("student")){
  return `👉 <a href="https://www.chegg.com" target="_blank">Chegg</a><br>
          👉 <a href="https://www.studypool.com" target="_blank">Studypool</a>`;
 }

 if(t.includes("passive")){
  return `👉 <a href="https://gumroad.com" target="_blank">Gumroad</a><br>
          👉 <a href="https://shopify.com" target="_blank">Shopify</a>`;
 }

 return `👉 <a href="https://www.google.com" target="_blank">Explore More</a>`;
}

// SIDEBAR
function loadChatList(){
 const user=auth.currentUser;

 db.collection("users").doc(user.uid)
 .collection("chats").orderBy("createdAt","desc")
 .get().then(snapshot=>{

  sidebar.innerHTML = `
  <button onclick="newChat()">➕ New Chat</button>
  <button onclick="goDashboard()">📊 Saved Plans</button>
  <button onclick="openIssueModal()">🛠 Report Issue</button>
  <button onclick="openTicketStatusModal()">🎫 Check Ticket Status</button>
  <button onclick="openMyTicketsModal()">🧾 My Tickets (${supportTickets.length})</button>
  <button onclick="runIdeaComparison()">⚖️ Compare Selected Ideas (${compareIdeas.length})</button>

  <button id="logoutBtn" onclick="logout()">🚪 Logout</button>

  <p style="font-size:12px;color:#94a3b8;">${auth.currentUser.email}</p>

  <button onclick="showUpgrade()">💎 Upgrade</button>

  <hr>
`;

  snapshot.forEach(doc=>{
    const container=document.createElement("div");
    container.className="chat-item";

    const title=document.createElement("span");
    title.innerText=doc.data().title;
    title.onclick=(e)=>{e.stopPropagation();
  loadChat(doc.id);
};

    const btn = document.createElement("span");
btn.innerText = "⋮";
btn.style.cursor = "pointer";

const menu = document.createElement("div");
menu.className = "chat-menu";

const rename = document.createElement("div");
rename.innerText = "Rename";
rename.onclick = () => {
  closeAllChatMenus();
  const newName = prompt("Enter new name:");
  if(newName) renameChat(doc.id, newName);
};

    const del = document.createElement("div");
del.innerText = "Delete";
del.onclick = () => {
  closeAllChatMenus();
  const shouldDelete = confirm("Delete this chat?");
  if(shouldDelete) deleteChat(doc.id);
};

menu.appendChild(rename);
menu.appendChild(del);

btn.onclick = (e) => {
  e.stopPropagation();
  const willOpen = menu.style.display !== "block";
  closeAllChatMenus();
  menu.style.display = willOpen ? "block" : "none";
};

    container.appendChild(title);
    container.appendChild(btn);
    container.appendChild(menu);

    sidebar.appendChild(container);

 });
}

// MESSAGE
function addMessage(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.innerHTML=text;

  const id = Date.now();
  div.setAttribute("data-id", id);

  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;

  return id; // 🔥 IMPORTANT
}

function escapeHtml(text){
  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function setInputValue(text){
  userInput.value = text || "";
  userInput.focus();
}

function openIssueModal(){
  closeMobileSidebar();
  issueModal.style.display = "flex";
}

function closeIssueModal(){
  issueModal.style.display = "none";
}

function openTicketStatusModal(){
  closeMobileSidebar();
  ticketStatusModal.style.display = "flex";
}

function closeTicketStatusModal(){
  ticketStatusModal.style.display = "none";
}

function getFriendlyServiceNowError(errorText){
  const text = String(errorText || "");
  if(text.includes("ServiceNow credentials are not configured on the backend.")){
    return "ServiceNow backend credentials are missing. Add SERVICENOW_INSTANCE, SERVICENOW_USERNAME, and SERVICENOW_PASSWORD to your backend environment and redeploy.";
  }
  return text;
}

function formatDisplayDate(value){
  if(!value) return "Unknown";
  const date = value?.toDate ? value.toDate() : new Date(value);
  if(Number.isNaN(date.getTime())) return String(value);
  return date.toLocaleString();
}

function closeMyTicketsModal(){
  myTicketsModal.style.display = "none";
}

function openMyTicketsModal(){
  closeMobileSidebar();
  renderMyTicketsModal();
  myTicketsModal.style.display = "flex";
}

function renderMyTicketsModal(){
  const items = [...supportTickets].sort((a, b) => {
    const aTime = new Date(a.lastCheckedAt || a.createdAt || 0).getTime();
    const bTime = new Date(b.lastCheckedAt || b.createdAt || 0).getTime();
    return bTime - aTime;
  });

  if(!items.length){
    myTicketsBody.innerHTML = `<div class="project-empty">No tickets yet. Raise an issue or push a project to ServiceNow and it will appear here.</div>`;
    return;
  }

  myTicketsBody.innerHTML = items.map(ticket => `
    <div style="background:#111827; border:1px solid #334155; border-radius:12px; padding:12px;">
      <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap;">
        <div>
          <div style="color:#93c5fd; font-weight:700;">${escapeHtml(ticket.number || "Ticket")}</div>
          <div style="color:#e5e7eb; margin-top:4px;">${escapeHtml(ticket.display || ticket.title || "No title available")}</div>
          <div style="color:#94a3b8; font-size:12px; margin-top:6px;">Status: ${escapeHtml(ticket.status || "Submitted")} | Source: ${escapeHtml(ticket.source || "support")}</div>
          <div style="color:#94a3b8; font-size:12px;">Updated: ${escapeHtml(formatDisplayDate(ticket.lastCheckedAt || ticket.updated_at || ticket.createdAt || ticket.created_at))}</div>
        </div>
        <button class="project-tab" onclick="checkStoredTicketStatus('${escapeHtml(ticket.number || "")}')">Refresh Status</button>
      </div>
    </div>
  `).join("");
}

function checkStoredTicketStatus(ticketNumber){
  closeMyTicketsModal();
  document.getElementById("ticketStatusNumber").value = ticketNumber || "";
  submitTicketStatusCheck();
}

function loadSupportTickets(){
  if(!auth.currentUser) return;
  db.collection("users").doc(auth.currentUser.uid)
    .collection("support_tickets")
    .orderBy("updatedAt", "desc")
    .get()
    .then(snapshot => {
      supportTickets = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderMyTicketsModal();
      loadChatList();
    })
    .catch(err => {
      console.error("support tickets load error", err);
    });
}

function saveSupportTicket(ticket){
  if(!auth.currentUser || !ticket?.number) return Promise.resolve();
  const docId = String(ticket.number).trim();
  const existing = supportTickets.find(item => item.number === docId) || {};
  const payload = {
    ...existing,
    ...ticket,
    number: docId,
    updatedAt: new Date().toISOString()
  };

  supportTickets = [payload, ...supportTickets.filter(item => item.number !== docId)];
  renderMyTicketsModal();
  loadChatList();

  return db.collection("users").doc(auth.currentUser.uid)
    .collection("support_tickets").doc(docId)
    .set(payload, { merge: true })
    .catch(err => console.error("support ticket save error", err));
}

function ensureActiveProjectTimeline(){
  if(!activeProject) return [];
  activeProject.timeline = Array.isArray(activeProject.timeline) ? activeProject.timeline : [];
  return activeProject.timeline;
}

function appendActiveProjectTimeline(type, title, details = {}){
  if(!activeProject) return;
  const timeline = ensureActiveProjectTimeline();
  timeline.unshift({
    type,
    title,
    details,
    createdAt: new Date().toISOString()
  });
  activeProject.timeline = timeline.slice(0, 25);
  saveActiveProjectToStore(activeProject);
  renderActiveProjectPanel();
}

function getProjectTickets(project){
  if(!project) return [];
  const linkedNumbers = Array.isArray(project.support_tickets) ? project.support_tickets : [];
  return supportTickets.filter(ticket =>
    linkedNumbers.includes(ticket.number) ||
    (project.title && ticket.project_title === project.title)
  );
}

function linkTicketToActiveProject(ticket){
  if(!activeProject || !ticket?.number) return;
  activeProject.support_tickets = Array.isArray(activeProject.support_tickets) ? activeProject.support_tickets : [];
  if(!activeProject.support_tickets.includes(ticket.number)){
    activeProject.support_tickets.push(ticket.number);
  }
  saveActiveProjectToStore(activeProject);
  renderActiveProjectPanel();
}

function renderProjectTimeline(project){
  const timeline = Array.isArray(project?.timeline) ? project.timeline : [];
  const linkedTickets = getProjectTickets(project);

  return `
    <div style="display:flex; flex-direction:column; gap:12px;">
      <div>
        <p><b>Project timeline</b></p>
        ${timeline.length ? timeline.map(item => `
          <div style="background:#111827; border:1px solid #1f2937; border-radius:10px; padding:10px; margin-bottom:8px;">
            <div style="color:#93c5fd; font-weight:600;">${escapeHtml(item.title || item.type || "Update")}</div>
            <div style="color:#94a3b8; font-size:12px; margin-top:4px;">${escapeHtml(formatDisplayDate(item.createdAt))}</div>
            ${item.details?.summary ? `<div style="margin-top:6px; color:#e5e7eb;">${escapeHtml(item.details.summary)}</div>` : ""}
          </div>
        `).join("") : `<div class="project-empty">No timeline activity yet. Run the toolkit, launch agent, or support flow to populate it.</div>`}
      </div>
      <div>
        <p><b>Related tickets</b></p>
        ${linkedTickets.length ? linkedTickets.map(ticket => `
          <div style="background:#0f172a; border:1px solid #334155; border-radius:10px; padding:10px; margin-bottom:8px;">
            <div style="color:#f8fafc; font-weight:600;">${escapeHtml(ticket.number || "Ticket")}</div>

function buildProjectAssets(project){
  const title = project?.title || "your idea";
  const audience = project?.who_is_this_for || "a narrow niche customer";
  const customerPack = project?.first_customer_pack || {};
  const landingProofPoints = Array.isArray(customerPack?.landing_page_copy?.proof_points)
    ? customerPack.landing_page_copy.proof_points.join("\n- ")
    : "";
  return {
    outreach: customerPack.cold_email || `Hi [Name], I am building ${title} for ${audience}. I noticed teams like yours often struggle with [specific pain point]. Would you be open to a 15-minute chat so I can show a simple version and get feedback?`,
    landing: customerPack.landing_page_copy ? `Headline: ${customerPack.landing_page_copy.headline || ""}\nSubheadline: ${customerPack.landing_page_copy.subheadline || ""}\nProof points:\n- ${landingProofPoints}\nCTA: ${customerPack.call_to_action || "Book an early access demo"}` : `Headline: Launch ${title} faster\nSubheadline: A focused solution for ${audience} who need a better way to handle this workflow.\nCTA: Book an early access demo`,
    offer: customerPack.pricing_offer ? `Package: ${customerPack.pricing_offer.package_name || ""}\nPrice: ${customerPack.pricing_offer.price_range || ""}\nIncluded:\n- ${(Array.isArray(customerPack.pricing_offer.what_is_included) ? customerPack.pricing_offer.what_is_included.join("\n- ") : customerPack.pricing_offer.what_is_included || "")}` : `First offer: I will set up the first version of ${title} for one niche customer, with onboarding support and a feedback loop, in exchange for an early pilot fee.`
  };
}

async function runLaunchAgent(){
  if(!activeProject) return;

  collapseActiveProject();
  const loadingId = addMessage(`⏳ Launch Agent is building assets for <b>${escapeHtml(activeProject.title)}</b>...`, "ai");
  trackEvent("launch_agent_run", { idea_title: activeProject.title });

  try{
    let res = await fetch("https://skill2income-api.onrender.com/launch-agent", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        idea_title: activeProject.title || "",
        idea_description: activeProject.description || "",
        history: messages.map(m => ({
          role: m.role,
          text: getHistoryText(m)
        }))
      })
    });

    if(!res.ok){
      res = await fetch("https://skill2income-api.onrender.com/generate-income-plan", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          request_type: "launch_agent",
          idea_title: activeProject.title || "",
          idea_description: activeProject.description || "",
          interests: activeProject.title || "",
          history: messages.map(m => ({
            role: m.role,
            text: getHistoryText(m)
          }))
        })
      });
    }

    if(!res.ok){
      removeMessage(loadingId);
      addMessage(`❌ Launch Agent could not finish. Server returned ${res.status}.`, "ai");
      return;
    }

    const data = await res.json();
    const plan = data?.result;
    if(!plan || Array.isArray(plan)){
      removeMessage(loadingId);
      addMessage("⚠️ Launch Agent response format not supported.","ai");
      return;
    }

    removeMessage(loadingId);
    activeProject.launch_agent = plan;
    appendActiveProjectTimeline("launch_agent", "Launch Agent completed", {
      summary: plan?.first_offer || "Launch assets were generated for this project."
    });
    const html = renderLaunchAgent(plan, activeProject.title || "Launch Agent");
    addMessage(html, "ai");
    messages.push({
      role: "ai",
      text: html,
      historyText: JSON.stringify({ launch_agent_for: activeProject.title, result: plan })
    });
    saveChat();
  } catch(err){
    removeMessage(loadingId);
    addMessage(`❌ Error: ${err.message || err}`, "ai");
  }
}

function toggleIdeaComparison(index){
  const idea = currentPlans[index];
  if(!idea) return;

  const exists = compareIdeas.find(item => item.title === idea.title);
  if(exists){
    compareIdeas = compareIdeas.filter(item => item.title !== idea.title);
    alert(`Removed "${idea.title}" from comparison.`);
  } else {
    if(compareIdeas.length >= 3){
      alert("You can compare up to 3 ideas at a time.");
      return;
    }
    compareIdeas.push(idea);
    alert(`Added "${idea.title}" to comparison.`);
  }

  loadChatList();
}

async function runIdeaComparison(){
  if(compareIdeas.length < 2){
    alert("Select at least 2 ideas first using Add to Compare.");
    return;
  }

  closeMobileSidebar();
  const loadingId = addMessage(`⏳ Comparing ${compareIdeas.length} ideas to help you pick the best one...`, "ai");
  trackEvent("idea_comparison_started", { count: compareIdeas.length });

  try{
    let res = await fetch("https://skill2income-api.onrender.com/idea-comparison", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        ideas: compareIdeas,
        history: messages.map(m => ({
          role: m.role,
          text: getHistoryText(m)
        }))
      })
    });

    if(!res.ok){
      res = await fetch("https://skill2income-api.onrender.com/generate-income-plan", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          request_type: "idea_comparison",
          ideas: compareIdeas,
          history: messages.map(m => ({
            role: m.role,
            text: getHistoryText(m)
          }))
        })
      });
    }

    if(!res.ok){
      removeMessage(loadingId);
      addMessage(`❌ Idea Comparison could not finish. Server returned ${res.status}.`, "ai");
      trackEvent("idea_comparison_failed", { error: `Server returned ${res.status}` });
      return;
    }

    const data = await res.json();
    const comparison = data?.result;
    if(!comparison || Array.isArray(comparison)){
      removeMessage(loadingId);
      addMessage("⚠️ Idea Comparison response format not supported.", "ai");
      trackEvent("idea_comparison_failed", { error: "Unsupported response format" });
      return;
    }

    removeMessage(loadingId);
    const html = renderIdeaComparison(comparison);
    addMessage(html, "ai");
    messages.push({
      role: "ai",
      text: html,
      historyText: JSON.stringify({ idea_comparison: compareIdeas.map(item => item.title), result: comparison })
    });
    saveChat();
    compareIdeas = [];
    loadChatList();
    trackEvent("idea_comparison_succeeded", { winner: comparison?.winner_title || "" });
  } catch(err){
    removeMessage(loadingId);
    const errorText = err.message || String(err);
    addMessage(`❌ Idea Comparison failed: ${escapeHtml(errorText)}`, "ai");
    trackEvent("idea_comparison_failed", { error: errorText });
  }
}

    });

    if(!res.ok){
      removeMessage(loadingId);
      addMessage("❌ AI Coach could not respond. Try again.","ai");
      return;
    }

    const data = await res.json();
    const coach = data?.result;
    removeMessage(loadingId);

    if(!coach || Array.isArray(coach)){
      addMessage("⚠️ AI Coach response format not supported.","ai");
      return;
    }

    const html = renderCoachReply(coach, coachIdea.title);
    addMessage(html, "ai");
    messages.push({
      role: "ai",
      text: html,
      historyText: JSON.stringify({ coach_idea: coachIdea.title, result: coach })
    });
    saveChat();
  } catch(err){
    removeMessage(loadingId);
    addMessage(`❌ Error: ${err.message || err}`, "ai");
  }
}

async function generateExecutionPlan(index){
  const idea = currentPlans[index];
  if(!idea) return;

  trackEvent("select_idea", { idea_title: idea.title, entry_point: "execution_plan" });
  trackEvent("execution_plan_clicked", { idea_title: idea.title });
  if(activeProject && activeProject.title === idea.title){
    activeProject.progress = activeProject.progress || {};
    activeProject.progress.execution_plan_opened = true;
    saveActiveProjectToStore(activeProject);
    renderActiveProjectPanel();
  }

  const loadingId = addMessage(`⏳ Building execution plan for <b>${escapeHtml(idea.title)}</b>...`, "ai");

  try{
    const res = await fetch("https://skill2income-api.onrender.com/generate-income-plan", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        request_type: "execution_plan",
        idea_title: idea.title || "",
        idea_description: idea.description || "",
        interests: idea.title || "",
        history: messages.map(m => ({
          role: m.role,
          text: getHistoryText(m)
        }))
      })
    });

    if(!res.ok){
      removeMessage(loadingId);
      addMessage("❌ Could not build execution plan. Try again.","ai");
      return;
    }

    const data = await res.json();
    const plan = data?.result;
    if(!plan || Array.isArray(plan)){
      removeMessage(loadingId);
      addMessage("⚠️ Execution plan format not supported.","ai");
      return;
    }

    removeMessage(loadingId);
    if(activeProject && activeProject.title === idea.title){
      activeProject.execution_plan = plan;
      activeProject.progress = activeProject.progress || {};
      activeProject.progress.execution_plan_opened = true;
      appendActiveProjectTimeline("execution_plan", "Execution plan generated", {
        summary: plan?.summary || "A practical execution plan was generated for this project."
      });
      saveActiveProjectToStore(activeProject);
      renderActiveProjectPanel();
    }
    const html = renderExecutionPlan(plan, idea.title || "Execution Plan");
    addMessage(html, "ai");
    messages.push({
      role: "ai",
      text: html,
      historyText: JSON.stringify({ execution_plan_for: idea.title, result: plan })
    });
    saveChat();
  } catch(err){
    removeMessage(loadingId);
    addMessage(`❌ Error: ${err.message || err}`, "ai");
  }
}

function renderPlan(plan){

  if (!Array.isArray(plan)) {
    addMessage("⚠️ Plan format not supported","ai");
    return "";
  }

  let html = `<div style="padding:10px;">`;

  plan.forEach((weekObj, i)=>{

    const weekTitle = weekObj?.week || `Week ${i+1}`;

let tasks = weekObj?.tasks;

if (!Array.isArray(tasks)) {
  if (typeof tasks === "string") {
    tasks = [tasks];
  } else {
    tasks = Object.values(weekObj || {}).flat();
  }
}

    html += `
      <div style="margin-bottom:15px; padding:10px; background:#111827; border-radius:10px;">
        <h3 style="color:#22c55e;">📅 ${weekTitle}</h3>
        <p style="color:#38bdf8; margin:6px 0 10px 0;"><b>Goal:</b> ${weekObj?.goal || "Complete this week's key milestone."}</p>
        <ul>
         ${(Array.isArray(tasks) ? tasks : typeof tasks === "string"
      ? [tasks]
      : Object.values(tasks || {})
).map(t => `<li>${t}</li>`).join("")}
        </ul>
      </div>
    `;
  });

  html += `</div>`;

  addMessage(html,"ai");
  return html;
}

function normalizeServiceNowRecordUrl(result){
  const table = String(result?.table || "incident").trim();
  const sysId = String(result?.sys_id || "").trim();
  const rawUrl = String(result?.url || "").trim();

  if(sysId){
    const instanceMatch = rawUrl.match(/^(https?:\/\/[^/]+)/i);
    const instanceBase = instanceMatch ? instanceMatch[1] : "https://dev350339.service-now.com";
    return `${instanceBase}/nav_to.do?uri=${encodeURIComponent(`${table}.do?sys_id=${sysId}`)}`;
  }

  return rawUrl;
}
